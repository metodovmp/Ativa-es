<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Espelho da Presença · Ativação V</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body{
      margin:0;
      background-color:#000;
      display:flex;
      justify-content:center;
      font-family:Arial,sans-serif;
      color:#fff;
      text-align:center;
    }

    .container{
      max-width:420px;
      width:100%;
      padding:28px 22px 40px;
      box-sizing:border-box;
    }

    /* 🔹 ASSINATURA */

    .footer{
      color:#8f8f8f;
      font-size:11px;
      margin-bottom:16px;
      letter-spacing:2px;
      font-weight:300;
    }

    /* 🔹 IMG 16:9 */

    .img-container{
      width:100%;
      aspect-ratio:16/9;
      background:#111;
      border-radius:12px;
      overflow:hidden;
      margin-bottom:26px;
    }

    .img-container img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    /* 🔹 TÍTULO */

    h1{
      color:#FFD700;
      font-size:25px;
      margin-bottom:10px;
      font-weight:600;
      letter-spacing:1px;
    }

    /* 🔹 SUBTÍTULO */

    h2{
      color:#ffffff;
      font-size:13px;
      font-weight:300;
      letter-spacing:2px;
      margin-bottom:26px;
    }

    /* 🔹 TEXTO */

    p{
      font-size:15px;
      line-height:1.8;
      margin-bottom:34px;
      color:#EAEAEA;
      font-weight:300;
    }

    /* 🔹 BOTÃO PREMIUM */

    .cta-wrapper{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
      margin-top:12px;
    }

    button{
      width:auto;

      padding:16px 34px;

      border-radius:999px;
      border:none;

      background-color:#FFD700;
      color:#000;

      font-weight:bold;
      font-size:15px;

      cursor:pointer;
      transition:0.3s ease;

      letter-spacing:0.5px;
    }

    button:hover{
      opacity:0.88;
    }

    /* 🔹 LEGENDA */

    .legenda{
      font-size:12px;
      color:#888;
      font-weight:300;
    }

  </style>
</head>

<body>

<div class="container">

<div class="footer">PRESENÇA SILENCIOSA · VMP</div>

<!-- 🔹 IMG TOPO -->
<div class="img-container">
  <img src="img/img005.jpg" onerror="this.src='img/placeholder.png'">
</div>
  
  <h1>Direção Correta</h1>

  <h2>CONSOLIDAÇÃO DO EIXO</h2>

  <p>
    O eixo interno define a direção.<br><br>

    Não se trata de esforço constante.<br>
    Postura,<br>
    ritmo<br>
    e intenção começam a se alinhar naturalmente.<br><br>

    Quando o eixo se sustenta,<br>
    a presença deixa de oscilar.
  </p>

  <div class="cta-wrapper">

    <button onclick="proximoPasso()">
      REFORCE SEU EIXO
    </button>

    <div class="legenda">
      Presença consolidada
    </div>

  </div>

</div>

<script>

  function proximoPasso() {
    window.location.href = "ativacao6.html";
  }

</script>

</body>
</html>
