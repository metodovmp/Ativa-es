<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>VSL AXIS • Diagnóstico</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{margin:0;background:#08080A;display:flex;justify-content:center;font-family:Inter,Arial,sans-serif;color:#fff}
    .container{width:100%;max-width:480px;padding:32px 20px 40px;box-sizing:border-box;text-align:center}
    .badge{display:inline-block;border:1px solid rgba(168,85,247,.3);background:rgba(168,85,247,.1);color:#A855F7;font-size:10px;letter-spacing:3px;font-weight:700;padding:6px 14px;border-radius:999px;margin-bottom:16px}
    h1{font-size:22px;font-weight:900;letter-spacing:5px;margin:0}
    .sub{color:#52525B;font-size:11px;letter-spacing:2px;margin-top:6px;margin-bottom:28px}
    .main-title{font-size:30px;line-height:1.1;font-weight:800;margin-bottom:12px}
    .main-title span{color:#A855F7}
    .desc{color:#A1A1AA;font-size:14px;line-height:1.6;margin-bottom:28px}
    .desc b{color:#fff}
    .form-box{background:#111113;border:1px solid #232326;border-radius:20px;padding:20px;text-align:left}
    input{width:100%;background:#08080A;border:1px solid #232326;border-radius:12px;padding:14px 16px;color:#fff;font-size:14px;box-sizing:border-box;margin-top:6px;margin-bottom:12px;outline:none;text-align:left}
    input:focus{border-color:#A855F7}
    button{width:100%;background:#A855F7;color:#fff;border:none;border-radius:999px;padding:16px;font-weight:800;font-size:14px;cursor:pointer;margin-top:8px}
    .choose{font-size:11px;color:#52525B;letter-spacing:1px;margin-top:20px;margin-bottom:10px}
    .tags{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .tag{background:#111113;border:1px solid #232326;border-radius:10px;padding:10px;font-size:12px;font-weight:600;color:#A1A1AA}
    .footer{margin-top:32px;font-size:10px;color:#27272A}
  </style>
</head>
<body>
<div class="container">
  <div class="badge">VSL AXIS • INTELIGÊNCIA</div>
  <h1>VSL AXIS</h1>
  <div class="sub">DIAGNÓSTICO • ESTRATÉGIA • ESCALA</div>
  <div class="main-title">SUA VSL ESTÁ <span>VAZANDO</span> DINHEIRO?</div>
  <div class="desc">Cole sua <b>VSL</b>, sua <b>página</b>, seu <b>criativo</b> ou suas <b>métricas</b>. Nossa IA mostra em 27s onde está o gargalo.</div>
  <div class="form-box">
    <form id="leadForm">
      <input type="email" name="email" placeholder="Seu melhor e-mail" required>
      <button type="submit">LIBERAR MEU DIAGNÓSTICO GRÁTIS →</button>
    </form>
  </div>
  <div class="choose">O QUE VOCÊ VAI DIAGNOSTICAR?</div>
  <div class="tags">
    <div class="tag">🎬 VSL</div>
    <div class="tag">📄 PÁGINA</div>
    <div class="tag">📢 ADS</div>
    <div class="tag">📊 MÉTRICAS</div>
  </div>
  <div class="footer">© 2026 VSL AXIS</div>
</div>
<script src="js/formspree.js"></script>
</body>
</html>
